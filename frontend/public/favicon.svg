<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"></stop>
      <stop offset="100%" stop-color="#06b6d4"></stop>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.25"></feDropShadow>
    </filter>
  </defs>

  <!-- Gradient rounded box -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#logoGradient)" filter="url(#shadow)"></rect>

  <!-- Code2 icon -->
  <path d="M25 22L15 32L25 42" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

  <path d="M39 22L49 32L39 42" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

  <path d="M36 17L28 47" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"></path>
</svg>